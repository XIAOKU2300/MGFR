name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dialogue-and-resource-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check tracked resource exclusions
        shell: pwsh
        run: ./tools/check-no-ip-assets.ps1
      - name: Install test dependencies
        run: python -m pip install -r dialogue-service/requirements-dev.txt
      - name: Test base dialogue service with stub engines
        working-directory: dialogue-service
        shell: pwsh
        run: |
          $env:MGFR_CONFIG = (Resolve-Path ./config.stub.toml).Path
          python -m pytest -q
